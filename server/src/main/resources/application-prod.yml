spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:smartorder}?useSSL=true&requireSSL=true&characterEncoding=utf8&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}

server:
  error:
    include-message: never
    include-stacktrace: never

smartorder:
  zone-id: ${TZ:Asia/Shanghai}
  security:
    jwt-secret: ${JWT_SECRET}
  payment:
    enabled-channels: ${PAYMENT_ENABLED_CHANNELS:MOCK}
    callback-base-url: ${PAYMENT_CALLBACK_BASE_URL}
  messaging:
    sms-enabled: ${SMS_ENABLED:false}
    sms-access-key: ${SMS_ACCESS_KEY:}
    sms-access-secret: ${SMS_ACCESS_SECRET:}
    sms-sign-name: ${SMS_SIGN_NAME:}

logging:
  level:
    root: INFO
    com.campus.smartorder: INFO
  file:
    name: ${LOG_FILE:/var/log/smartorder/server.log}
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 14
